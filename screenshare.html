<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenShare P2P</title>
  <style>/* ============================================================================
 * ScreenShare P2P — styles
 * Dark theme, mobile-friendly, system font stack. No external CSS.
 * ========================================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #0f0f1a;
  --bg-secondary: #1a1a2e;
  --bg-card: #16213e;
  --bg-elev: #1f2747;
  --accent: #e94560;
  --accent-hover: #ff6b6b;
  --text-primary: #ffffff;
  --text-secondary: #a0a0b0;
  --text-muted: #6b6b80;
  --border: #2a2a4a;
  --border-strong: #3a3a5a;
  --success: #4ade80;
  --warn: #fbbf24;
  --error: #f87171;
  --error-bg: #3a1a1f;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-glow: 0 4px 20px rgba(233, 69, 96, 0.3);
}

html, body {
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Roboto, "Helvetica Neue", Arial,
    sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.5;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

/* ---- Header ------------------------------------------------------------- */

.page-header {
  text-align: center;
  margin-bottom: 28px;
}

h1 {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

.subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  letter-spacing: 0.5px;
}

/* ---- Status bar --------------------------------------------------------- */

.status-bar {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.status-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--text-secondary);
}

#statusText {
  font-variant-numeric: tabular-nums;
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: background 0.2s, box-shadow 0.2s;
  flex-shrink: 0;
}

.status-dot.connected {
  background: var(--success);
  box-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
}

.status-dot.waiting {
  background: var(--warn);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

@media (prefers-reduced-motion: reduce) {
  .status-dot.waiting { animation: none; }
}

/* ---- Error toast -------------------------------------------------------- */

.error {
  background: var(--error-bg);
  border: 1px solid var(--error);
  color: var(--error);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 20px;
  font-size: 14px;
  word-break: break-word;
}

/* ---- Panels ------------------------------------------------------------- */

.panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
}

.panel-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text-primary);
}

.panel-hint,
.hint {
  color: var(--text-secondary);
  font-size: 13px;
  margin-bottom: 16px;
  line-height: 1.6;
}

.hint {
  margin-top: 4px;
  margin-bottom: 16px;
}

/* ---- Buttons ------------------------------------------------------------ */

.btn {
  padding: 14px 24px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s,
    color 0.15s, border-color 0.15s, opacity 0.15s;
  font-family: inherit;
  text-align: center;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
  color: white;
  box-shadow: var(--shadow-glow);
}

.btn-primary:hover:not([disabled]) {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(233, 69, 96, 0.45);
}

.btn-primary:active:not([disabled]) {
  transform: translateY(0);
}

.btn-primary[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn-secondary[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
}

.row {
  display: flex;
  gap: 12px;
  align-items: stretch;
  flex-wrap: wrap;
}

.row > .btn {
  flex: 1 1 0;
  min-width: 120px;
}

/* ---- Info box & share link --------------------------------------------- */

.info-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 16px;
}

.info-box h4 {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}

.share-link-row {
  display: flex;
  gap: 10px;
  align-items: stretch;
  flex-wrap: wrap;
}

#shareLink {
  flex: 1 1 0;
  min-width: 0;
  font-family: "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono",
    "Courier New", monospace;
  font-size: 12px;
  color: var(--accent);
  background: var(--bg-primary);
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  text-decoration: none;
  word-break: break-all;
  display: flex;
  align-items: center;
  line-height: 1.4;
  transition: border-color 0.15s;
}

#shareLink:hover {
  border-color: var(--accent);
  text-decoration: none;
}

.copy-btn {
  padding: 8px 16px;
  font-size: 13px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-family: inherit;
  transition: background 0.15s;
  flex-shrink: 0;
  min-width: 72px;
}

.copy-btn:hover {
  background: var(--accent-hover);
}

.copy-btn:active {
  transform: translateY(1px);
}

/* ---- Video area --------------------------------------------------------- */

.video-area {
  position: relative;
  width: 100%;
  background: #000;
  border-radius: var(--radius-sm);
  overflow: hidden;
  aspect-ratio: 16 / 9;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
}

.video-area video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background: #000;
}

.video-area:fullscreen,
.video-area:-webkit-full-screen {
  border: none;
  border-radius: 0;
}

.video-area:fullscreen video,
.video-area:-webkit-full-screen video {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
}

.fullscreen-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: none;
  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease, transform 0.15s ease;
  z-index: 2;
}

.fullscreen-btn:hover {
  background: rgba(0, 0, 0, 0.8);
  transform: scale(1.05);
}

.fullscreen-btn:active {
  transform: scale(0.95);
}

.viewer-hint {
  position: absolute;
  bottom: 8px;
  left: 12px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.6);
  pointer-events: none;
  user-select: none;
  z-index: 1;
}

.video-area:fullscreen .viewer-hint,
.video-area:-webkit-full-screen .viewer-hint {
  bottom: 16px;
  left: 16px;
  font-size: 14px;
}

/* ---- Quality selector (host lobby) -------------------------------------- */

.quality-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0 8px;
  font-size: 14px;
  color: var(--text-secondary);
}

.quality-select {
  flex: 1;
  padding: 8px 12px;
  background: var(--bg-elev);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

.quality-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(233, 69, 96, 0.2);
}

@media (prefers-reduced-motion: reduce) {
  .fullscreen-btn {
    transition: none;
  }
  .fullscreen-btn:hover,
  .fullscreen-btn:active {
    transform: none;
  }
}

/* ---- Visibility utility ------------------------------------------------- */

.hidden {
  display: none !important;
}

/* ---- Mobile tweaks ------------------------------------------------------ */

@media (max-width: 600px) {
  body { padding: 16px 12px; }
  h1 { font-size: 26px; }
  .panel { padding: 20px; }
  .row > .btn { flex: 1 1 100%; }
  .share-link-row { flex-direction: column; }
  .copy-btn { width: 100%; }
  #statusText { font-size: 13px; }
}
</style>
</head>

  <div class="container">
    <header class="page-header">
      <h1>ScreenShare P2P</h1>
      <p class="subtitle">P2P直连 · 无需中转 · 链接分享即可</p>
    </header>

    <div class="status-bar">
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">未连接</span>
      </div>
    </div>

    <div class="error hidden" id="errorToast" role="alert"></div>

    <!-- Landing -->
    <div class="panel" id="landingPanel">
      <div class="panel-title">开始</div>
      <p class="panel-hint">创建一个房间并把链接发给朋友，或加入朋友发来的链接（链接会带 # 房间号）。</p>
      <div class="row">
        <button class="btn btn-primary" id="createBtn">创建房间</button>
        <button class="btn btn-secondary" id="joinBtn">加入房间</button>
      </div>
    </div>

    <!-- Host Lobby -->
    <div class="panel hidden" id="hostLobbyPanel">
      <div class="panel-title">你的房间</div>
      <p class="panel-hint">把下面的链接发给朋友。朋友打开后会自动连接。</p>
      <div class="info-box">
        <h4>分享链接</h4>
        <div class="share-link-row">
          <a id="shareLink" target="_blank" rel="noopener"></a>
          <button class="copy-btn" id="copyBtn" type="button">复制</button>
        </div>
      </div>
      <div class="quality-row">
        <label for="qualitySelect">画质：</label>
        <select id="qualitySelect" class="quality-select">

          <option value="1080p" selected>1080p（高清，推荐）</option>
          <option value="1440p">1440p（2K）</option>
          <option value="source">原始（不缩放）</option>
        </select>
      </div>
      <p class="hint">朋友连接后，可以点击"开始共享"。</p>
      <div class="row">
        <button class="btn btn-primary" id="startShareBtn" disabled>开始共享</button>
        <button class="btn btn-secondary hidden" id="stopShareBtn">停止共享</button>
      </div>
    </div>

    <!-- Viewer Waiting -->
    <div class="panel hidden" id="viewerWaitingPanel">
      <div class="panel-title">正在连接</div>
      <p class="panel-hint">等待主机开始共享屏幕...</p>
      <button class="btn btn-secondary hidden" id="reconnectBtn">重新连接</button>
    </div>

    <!-- Viewer Stream -->
    <div class="panel hidden" id="viewerStreamPanel">
      <div class="panel-title">共享画面</div>
      <div class="video-area" id="videoArea">
        <video id="remoteVideo" autoplay playsinline muted></video>
        <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="全屏">
          <span aria-hidden="true">⛶</span>
        </button>
        <div class="viewer-hint">右键视频可取消静音</div>
      </div>
    </div>
  </div>

    'join-room': STATES.VIEWER_CONNECTING,
    'error': STATES.ERROR,

  [STATES.HOSTING_WAITING]: {
    'viewer-joined': STATES.HOSTING_CONNECTED,
    'disconnect': STATES.IDLE,
    'error': STATES.ERROR,
  },
  [STATES.HOSTING_CONNECTED]: {
    'start-sharing': STATES.HOSTING_SHARING,
    'disconnect': STATES.CLOSED,
    'error': STATES.ERROR,
  },
  [STATES.HOSTING_SHARING]: {

    'disconnect': STATES.CLOSED,
    'error': STATES.ERROR,

// --- Stop sharing (host) ---------------------------------------------------
//

      /* ignore */

  }

  if (video) video.srcObject = null;

  const stopBtn = document.getElementById('stopShareBtn');

// --- Start sharing (host) --------------------------------------------------

async function copyLink(ui, url) {

  try {
    await navigator.clipboard.writeText(url);

    // The host may not have clipboard permission (e.g. served from file://
    // in some browsers). Log and move on — the user can still copy manually.
    console.error('clipboard write failed:', err);
    return;
  }
  const btn = document.getElementById('copyBtn');
  if (!btn) return;
  const original = btn.textContent;
  btn.textContent = '已复制!';
  setTimeout(() => {
    btn.textContent = original;
  }, COPY_BUTTON_FLASH_MS);

    console.warn('Fullscreen API not supported on this browser');
    return;
  }

    const result = req();
    if (result && typeof result.catch === 'function') {
      result.catch((err) => console.warn('Fullscreen request rejected:', err));
    }
  } catch (err) {
    console.warn('Fullscreen request threw:', err);
  }

          window.location.hash = `#${entered.trim()}`;
          window.location.reload();

      onStartSharing: () => {
        startSharing(ui).catch((err) => {
          ui.showError('共享失败: ' + (err?.message || String(err)));

      onStopSharing: () => stopSharing(ui),
      onCopyLink: (url) => copyLink(ui, url),

      onQualityChange: () => {

    ui.showPanel('landing');
    ui.setStatus('未连接', '');

      typeof window.location.hash === 'string' &&
